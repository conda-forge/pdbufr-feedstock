schema_version: 1

context:
  name: pdbufr
  version: "0.16.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: baea51938ed8cc13e72b73b38601a9a6ab851b3408276ada4704a91255ce4ed1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
    # setuptools-scm[toml] needs nothing extra on conda-forge
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - attrs
    - python-eccodes
    - pandas
    - pint

tests:
  - python:
      imports:
        - pdbufr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Extracts data from a BUFR file as a Pandas DataFrame using ecCodes
  homepage: https://github.com/ecmwf/pdbufr
  repository: https://github.com/ecmwf/pdbufr
  documentation: https://pdbufr.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - sandorkertesz
    - iainrussell
    - xylar
